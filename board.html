<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://kflu-builder-union.pages.dev/board.html">

    <meta property="og:title" content="경기남부본부 활동 게시판">
    <meta property="og:description" content="건설 현장 활동 및 노동조합 소식">
    <meta property="og:url" content="https://kflu-builder-union.pages.dev/board.html">
    <meta property="og:type" content="article">

    <title>활동 게시판 | 경기남부본부</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body class="bg-slate-50">
    
    <kflu-navbar></kflu-navbar>

    <div class="bg-blue-900 pt-40 pb-20 px-6 text-center text-white">
        <h1 class="text-4xl font-black mb-4 tracking-tight text-white">활동 소식 및 게시판</h1>
        <p class="opacity-70 font-light">경기남부 건설 현장의 투쟁 기록과 소식을 공유합니다.</p>
    </div>

    <section class="py-16 px-6 -mt-10">
        <div class="max-w-7xl mx-auto bg-white rounded-[2rem] shadow-xl overflow-hidden p-8">
            <div class="flex flex-col md:flex-row justify-between mb-8 gap-4">
                <div class="flex gap-2">
                    <button class="px-6 py-2 bg-blue-600 text-white rounded-xl font-bold">전체</button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b-2 border-slate-100 text-slate-400 text-xs font-black uppercase tracking-widest">
                            <th class="px-6 py-4 w-20 text-center">번호</th>
                            <th class="px-6 py-4">제목</th>
                            <th class="px-6 py-4 w-32 text-center">작성자</th>
                            <th class="px-6 py-4 w-32 text-center">날짜</th>
                            <th class="px-6 py-4 w-40 text-center">관리</th>
                        </tr>
                    </thead>
                    <tbody id="post-list" class="divide-y divide-slate-50">
                        <tr>
                            <td colspan="5" class="px-6 py-10 text-center text-slate-400">게시글을 불러오는 중입니다...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-10 flex justify-center">
                <button id="write-btn" class="bg-slate-900 text-white px-10 py-3 rounded-xl font-bold hover:shadow-lg transition">글쓰기</button>
            </div>
        </div>
    </section>

    <div id="post-modal" class="fixed inset-0 z-[100] hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onclick="closePostModal()"></div>
            <div class="relative bg-white rounded-2xl overflow-hidden shadow-xl transform transition-all sm:max-w-lg sm:w-full p-8">
                <h3 class="text-2xl font-bold mb-6" id="modal-title">새 게시글 작성</h3>
                <form id="post-form" class="space-y-4">
                    <input type="hidden" id="post-id">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">제목</label>
                        <input type="text" id="post-title" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="제목을 입력하세요">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">내용</label>
                        <textarea id="post-content" required class="w-full px-4 py-2 border rounded-xl h-48 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="내용을 입력하세요"></textarea>
                    </div>
                    <div class="flex gap-4 mt-6">
                        <button type="button" onclick="closePostModal()" class="flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition">취소</button>
                        <button type="submit" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">저장하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="view-modal" class="fixed inset-0 z-[100] hidden overflow-y-auto" aria-labelledby="view-modal-title" role="dialog" aria-modal="true">
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onclick="closeViewModal()"></div>
            <div class="relative bg-white rounded-2xl overflow-hidden shadow-xl transform transition-all sm:max-w-2xl sm:w-full p-8">
                <div class="flex justify-between items-start mb-6 border-b pb-4">
                    <div>
                        <h3 class="text-3xl font-bold text-slate-800" id="view-title">제목</h3>
                        <div class="mt-2 text-sm text-slate-500 flex gap-4">
                            <span><i class="fa-solid fa-user mr-1"></i> <span id="view-author">작성자</span></span>
                            <span><i class="fa-solid fa-calendar mr-1"></i> <span id="view-date">날짜</span></span>
                        </div>
                    </div>
                    <button onclick="closeViewModal()" class="text-gray-400 hover:text-gray-600">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <div class="prose max-w-none text-slate-700 leading-relaxed whitespace-pre-wrap min-h-[200px]" id="view-content">
                    내용이 여기에 표시됩니다.
                </div>
                <div class="mt-10 pt-6 border-t flex justify-end">
                    <button onclick="closeViewModal()" class="px-8 py-3 bg-slate-900 text-white rounded-xl font-bold hover:shadow-lg transition">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <kflu-footer></kflu-footer>
    <kflu-auth-modals></kflu-auth-modals>

    <script type="module" src="components.js"></script>
    <script type="module">
        import { 
            auth, db, onAuthStateChanged, collection, addDoc, getDocs, query, orderBy, doc, deleteDoc, updateDoc, getDoc, serverTimestamp 
        } from './main.js';

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            loadPosts();
        });

        function formatDate(timestamp) {
            if (!timestamp) return '-';
            if (timestamp.seconds) {
                return new Date(timestamp.seconds * 1000).toLocaleDateString();
            }
            if (timestamp instanceof Date) {
                return timestamp.toLocaleDateString();
            }
            return new Date(timestamp).toLocaleDateString();
        }

        async function loadPosts() {
            const postList = document.getElementById('post-list');
            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                postList.innerHTML = '';
                
                if (querySnapshot.empty) {
                    postList.innerHTML = '<tr><td colspan="5" class="px-6 py-10 text-center text-slate-400">등록된 게시글이 없습니다.</td></tr>';
                    return;
                }

                const docs = querySnapshot.docs;
                const notices = docs.filter(d => d.data().isNotice === true);
                const regulars = docs.filter(d => d.data().isNotice !== true);

                notices.forEach((docSnap) => {
                    renderRow(docSnap, '공지', true);
                });

                let index = regulars.length;
                regulars.forEach((docSnap) => {
                    renderRow(docSnap, index--, false);
                });

                function renderRow(docSnap, displayIndex, isNotice) {
                    const data = docSnap.data();
                    const date = formatDate(data.createdAt);
                    const isAuthor = currentUser && currentUser.uid === data.authorId;

                    const tr = document.createElement('tr');
                    tr.className = isNotice ? 'bg-blue-50/50 hover:bg-blue-100 transition cursor-pointer font-semibold' : 'hover:bg-blue-50 transition cursor-pointer';
                    tr.onclick = (e) => {
                        if (e.target.closest('button')) return;
                        window.viewPost(docSnap.id);
                    };
                    
                    const indexHtml = isNotice 
                        ? `<span class="px-2 py-1 bg-blue-600 text-white text-[10px] font-bold rounded-lg uppercase tracking-tighter">공지</span>`
                        : displayIndex;

                    tr.innerHTML = `
                        <td class="px-6 py-5 text-center text-slate-500">${indexHtml}</td>
                        <td class="px-6 py-5 ${isNotice ? 'text-blue-900' : 'text-slate-800'} font-bold">
                            ${isNotice ? `<i class="fa-solid fa-bullhorn mr-2 text-blue-500"></i>` : ''}
                            ${data.title}
                        </td>
                        <td class="px-6 py-5 text-center text-sm text-slate-500">${data.authorName || '익명'}</td>
                        <td class="px-6 py-5 text-center text-sm text-slate-400">${date}</td>
                        <td class="px-6 py-5 text-center">
                            ${isAuthor ? `
                                <button onclick="window.editPost('${docSnap.id}')" class="text-blue-600 hover:text-blue-800 mr-3"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="window.deletePost('${docSnap.id}')" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                            ` : '-'}
                        </td>
                    `;
                    postList.appendChild(tr);
                }
            } catch (error) {
                console.error("Error loading posts: ", error);
                postList.innerHTML = `<tr><td colspan="5" class="px-6 py-10 text-center text-red-400">데이터를 불러오는데 실패했습니다.<br><span class="text-xs opacity-70">${error.message}</span></td></tr>`;
            }
        }

        window.viewPost = async (id) => {
            try {
                const docSnap = await getDoc(doc(db, "posts", id));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('view-title').textContent = data.title;
                    document.getElementById('view-author').textContent = data.authorName || '익명';
                    document.getElementById('view-date').textContent = formatDate(data.createdAt);
                    document.getElementById('view-content').textContent = data.content;
                    window.openViewModal();
                }
            } catch (error) {
                alert('불러오기 실패: ' + error.message);
            }
        };

        window.openViewModal = () => {
            document.getElementById('view-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        window.closeViewModal = () => {
            document.getElementById('view-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        };

        document.getElementById('write-btn').onclick = () => {
            if (!currentUser) {
                alert('로그인이 필요한 서비스입니다.');
                if (window.openModal) window.openModal('login-modal');
                return;
            }
            document.getElementById('modal-title').textContent = '새 게시글 작성';
            document.getElementById('post-form').reset();
            document.getElementById('post-id').value = '';
            window.openPostModal();
        };

        window.openPostModal = () => {
            document.getElementById('post-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        window.closePostModal = () => {
            document.getElementById('post-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        };

        document.getElementById('post-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const id = document.getElementById('post-id').value;
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;

            try {
                if (id) {
                    await updateDoc(doc(db, "posts", id), {
                        title,
                        content,
                        updatedAt: serverTimestamp()
                    });
                    alert('수정되었습니다.');
                } else {
                    const authorName = currentUser.displayName || currentUser.email.split('@')[0];
                    await addDoc(collection(db, "posts"), {
                        title,
                        content,
                        authorId: currentUser.uid,
                        authorName: authorName,
                        createdAt: serverTimestamp()
                    });
                    alert('등록되었습니다.');
                }
                window.closePostModal();
                loadPosts();
            } catch (error) {
                alert('저장 실패: ' + error.message);
            }
        };
           // 🔥 URL로 직접 게시글 열기
           const urlParams = new URLSearchParams(window.location.search);
           const postId = urlParams.get('id');

           if (postId) {
               viewPost(postId);
           }
        window.editPost = async (id) => {
            try {
                const docSnap = await getDoc(doc(db, "posts", id));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('modal-title').textContent = '게시글 수정';
                    document.getElementById('post-id').value = id;
                    document.getElementById('post-title').value = data.title;
                    document.getElementById('post-content').value = data.content;
                    window.openPostModal();
                }
            } catch (error) {
                alert('불러오기 실패: ' + error.message);
            }
        };

        window.deletePost = async (id) => {
            if (confirm('정말 삭제하시겠습니까?')) {
                try {
                    await deleteDoc(doc(db, "posts", id));
                    alert('삭제되었습니다.');
                    loadPosts();
                } catch (error) {
                    alert('삭제 실패: ' + error.message);
                }
            }
        };
    </script>
</body>
</html>
